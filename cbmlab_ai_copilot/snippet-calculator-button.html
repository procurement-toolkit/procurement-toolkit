<!--
  기존 계산기 페이지(예: fob-cif.html)의 "결과" 영역 하단에 이 블록을 추가하세요.
  계산 결과가 갱신될 때마다 계산기의 기존 JS에서 updateHandoffButton()을 호출하도록
  연결하면 됩니다. (계산기마다 결과 변수명이 다르므로 이 부분만 각 페이지에 맞게 수정)
-->

<div class="ai-handoff-box" style="margin-top:16px;padding:16px;border:1px solid #ddd;border-radius:8px;">
  <button id="ai-email-btn" type="button" disabled>
    이 결과로 영문 이메일 초안 작성 (AI)
  </button>
  <p style="font-size:13px;color:#666;margin-top:8px;">
    계산 결과를 이메일 코파일럿으로 보내 협상/RFQ/클레임 메일 초안을 만듭니다.
  </p>
</div>

<script src="/assets/js/ai-handoff.js"></script>
<script>
  // 이 함수는 계산기의 "계산하기" 버튼 클릭 핸들러 마지막 줄에서 호출하세요.
  // result 객체는 각 계산기의 실제 계산 결과 변수로 교체.
  function updateHandoffButton(result) {
    const btn = document.getElementById('ai-email-btn');
    btn.disabled = false;

    btn.onclick = function () {
      // summary는 계산기 자신이 작성 — AI 프롬프트에 그대로 쓰일 한국어 한 줄
      const summary =
        `수입원가 계산 결과: FOB 단가 $${result.unitCost}, ` +
        `총 landed cost $${result.totalLandedCost} ` +
        `(관세 ${(result.dutyRate * 100).toFixed(1)}% 포함), ` +
        `공급업체 ${result.supplierCountry}`;

      CBMLabHandoff.save('fob-cif', summary, {
        incoterm: result.incoterm,
        currency: result.currency,
        unitCost: result.unitCost,
        quantity: result.quantity,
        totalLandedCost: result.totalLandedCost,
        dutyRate: result.dutyRate,
        supplierCountry: result.supplierCountry,
      });

      window.location.href = '/email-copilot.html';
    };
  }

  // 예시: 계산 즉시 버튼 활성화하고 싶다면 페이지 로드 시 더미 호출
  // updateHandoffButton({ unitCost: 3.2, totalLandedCost: 12450, dutyRate: 0.075, supplierCountry: 'CN', incoterm: 'FOB', currency: 'USD', quantity: 3890 });
</script>
