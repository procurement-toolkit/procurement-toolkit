<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퇴사 확률 계산기 - 이번 달 나의 퇴사 확률은 | 내위치</title>
<meta name="description" content="월급, 야근, 상사, 통근시간까지 입력하면 이번 달 퇴사 확률과 결정적 사유를 알려드려요. 결과 캡처해서 동료와 공감해보세요.">
<meta property="og:title" content="이번 달 나의 퇴사 확률은?">
<meta property="og:description" content="10초면 나오는 퇴사 확률 계산기 - 내위치">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1420; --card:#261E30; --ink:#F2EEF7; --ink-soft:#A797BC;
    --coral:#C158E0; --coral-dark:#9A3EB8; --mint:#58D6C1; --mint-dark:#33A895;
    --yellow:#FFC94D; --line:#3B2E4A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Noto Sans KR', sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:480px;margin:0 auto;padding:0 20px 60px;}
  .brandbar{display:flex;align-items:baseline;gap:6px;padding:18px 0 0;text-decoration:none;}
  .brandbar .b1{font-family:'Jua',sans-serif;font-size:20px;color:var(--ink);}
  .brandbar .b2{font-size:11px;color:var(--ink-soft);}
  .hero{text-align:center;padding:18px 0 8px;}
  .hero h1{font-family:'Jua',sans-serif;font-size:25px;line-height:1.4;margin:0 0 6px;color:var(--ink);}
  .hero p{font-size:14px;color:var(--ink-soft);margin:0;}
  .card{background:var(--card);border-radius:20px;padding:22px 20px;margin-top:18px;box-shadow:0 6px 0 var(--line);}
  .card h2{font-family:'Jua',sans-serif;font-size:16px;margin:0 0 14px;color:var(--ink);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);margin-bottom:6px;}
  select{
    width:100%;padding:12px 14px;font-size:15px;font-family:'Noto Sans KR',sans-serif;
    border:2px solid var(--line);border-radius:12px;background:#1f1828;color:var(--ink);
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%23A797BC' stroke-width='2' fill='none'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;
  }
  select:focus{outline:none;border-color:var(--coral);}
  .go-btn{
    width:100%;padding:15px;margin-top:8px;background:var(--coral);color:#fff;border:none;
    border-radius:14px;font-family:'Jua',sans-serif;font-size:18px;cursor:pointer;
    box-shadow:0 5px 0 var(--coral-dark);transition:transform .05s;
  }
  .go-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--coral-dark);}

  .result{display:none;margin-top:22px;}
  .result.show{display:block;}
  .result-card{
    background:linear-gradient(180deg,#2E2038,#1A1420);
    border:2px solid var(--line);border-radius:22px;padding:28px 20px;text-align:center;
  }
  .result-emoji{font-size:64px;line-height:1;margin-bottom:8px;}
  .result-tier{font-family:'Jua',sans-serif;font-size:22px;color:var(--ink);margin:0 0 4px;}
  .result-pct{font-family:'Jua',sans-serif;font-size:52px;color:var(--coral);margin:6px 0;}
  .result-pct span{font-size:22px;color:var(--ink-soft);}
  .result-reason{
    font-family:'Jua',sans-serif;font-size:16px;color:var(--yellow);margin:12px 0 0;
    background:var(--bg);border-radius:12px;padding:10px 14px;display:inline-block;
  }
  .result-line{font-size:14px;color:var(--ink-soft);margin:10px 0 0;line-height:1.6;}

  .meter{position:relative;height:22px;background:var(--bg);border-radius:11px;border:2px solid var(--line);margin:20px 0 6px;overflow:hidden;}
  .meter-fill{height:100%;border-radius:9px;background:linear-gradient(90deg,#58D6C1,#C158E0);transition:width 1s cubic-bezier(.34,1.56,.64,1);}
  .meter-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);}

  .factors{margin-top:22px;}
  .factors h3{font-family:'Jua',sans-serif;font-size:14px;color:var(--ink-soft);margin:0 0 10px;}
  .factor-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--bg);border-radius:12px;padding:11px 14px;margin-bottom:8px;border:1px solid var(--line);
  }
  .factor-item .ftxt{font-size:13px;color:var(--ink);}
  .factor-item .fscore{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;flex-shrink:0;}
  .fscore.low{background:#1E3A35;color:#7FE0CE;}
  .fscore.mid{background:#3A331E;color:#FFC94D;}
  .fscore.high{background:#3A1E38;color:#E088D8;}

  .share-btn{
    width:100%;padding:14px;margin-top:20px;background:var(--mint);color:#0C2E28;
    border:none;border-radius:14px;font-family:'Jua',sans-serif;font-weight:700;font-size:15px;cursor:pointer;
    box-shadow:0 5px 0 var(--mint-dark);
  }
  .share-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--mint-dark);}
  .disclaimer{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:14px;line-height:1.6;}

  .related{margin-top:28px;}
  .related h3{font-family:'Jua',sans-serif;font-size:15px;margin:0 0 10px;color:var(--ink-soft);}
  .related-grid{display:flex;flex-direction:column;gap:8px;}
  .related-item{
    display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;
    padding:12px 14px;text-decoration:none;color:var(--ink);border:2px solid var(--line);
  }
  .related-item .emoji{font-size:20px;}
  .related-item .txt{font-size:13px;font-weight:500;}
  .footer-link{display:block;text-align:center;margin-top:26px;font-size:12px;color:var(--ink-soft);text-decoration:none;}
</style>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="wrap">

  <a class="brandbar" href="index.html">
    <span class="b1">내위치</span>
    <span class="b2">by CBM Lab</span>
  </a>

  <div class="hero">
    <h1>퇴사 확률 계산기</h1>
    <p>이번 달 마음속 사직서, 몇 %나 썼나요</p>
  </div>

  <div class="card">
    <h2>요즘 회사 생활</h2>
    <div class="field">
      <label for="salary">월급에 대한 만족도</label>
      <select id="salary">
        <option value="4">많이 부족해요</option>
        <option value="2" selected>그럭저럭이에요</option>
        <option value="0">만족해요</option>
      </select>
    </div>
    <div class="field">
      <label for="overtime">일주일에 야근하는 날</label>
      <select id="overtime">
        <option value="0">0일</option>
        <option value="1" selected>1~2일</option>
        <option value="2">3~4일</option>
        <option value="4">거의 매일</option>
      </select>
    </div>
    <div class="field">
      <label for="leave">연차, 자유롭게 쓰는 정도</label>
      <select id="leave">
        <option value="0">자유롭게 씀</option>
        <option value="2" selected>눈치 좀 봄</option>
        <option value="4">거의 못 씀</option>
      </select>
    </div>
    <div class="field">
      <label for="boss">직속 상사 스타일</label>
      <select id="boss">
        <option value="0">괜찮은 편</option>
        <option value="1">방임형 (관심 없음)</option>
        <option value="3" selected>마이크로매니징</option>
        <option value="4">폭언·감정기복 있음</option>
      </select>
    </div>
    <div class="field">
      <label for="commute">편도 통근시간</label>
      <select id="commute">
        <option value="0">30분 이내</option>
        <option value="1" selected>30분~1시간</option>
        <option value="2">1~1시간 30분</option>
        <option value="4">1시간 30분 이상</option>
      </select>
    </div>
    <div class="field">
      <label for="jobsearch">최근 이직 공고 보는 빈도</label>
      <select id="jobsearch">
        <option value="0">거의 안 봄</option>
        <option value="1" selected>가끔 봄</option>
        <option value="2">일주일에 몇 번</option>
        <option value="4">매일 봄</option>
      </select>
    </div>
    <div class="field">
      <label for="vision">회사 미래에 대한 확신</label>
      <select id="vision">
        <option value="0">확신 있음</option>
        <option value="2" selected>잘 모르겠음</option>
        <option value="4">확신 없음</option>
      </select>
    </div>
    <button class="go-btn" onclick="showResult()">퇴사 확률 확인하기 →</button>
  </div>

  <div class="result" id="resultBox">
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji"></div>
      <p class="result-tier" id="resultTier"></p>
      <p class="result-pct" id="resultPct"></p>
      <p class="result-reason" id="resultReason"></p>
      <p class="result-line" id="resultLine"></p>
      <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
      <div class="meter-labels"><span>계속 다님</span><span>사직서</span></div>
    </div>

    <div class="factors">
      <h3>💡 확률을 끌어올린 항목</h3>
      <div id="factorsList"></div>
    </div>

    <button class="share-btn" onclick="shareResult()">📤 카톡으로 동료와 공감하기</button>
    <p class="disclaimer">🎭 재미로 보는 콘텐츠입니다. 진짜 퇴사를 고민 중이시라면 노동상담(고용노동부 1350)도 참고해보세요.</p>
  </div>

  <div class="related">
    <h3>다른 사람들이 본 랭킹</h3>
    <div class="related-grid">
      <a class="related-item" href="office-slave-meter.html">
        <span class="emoji">🐴</span><span class="txt">회사 노예 측정기</span>
      </a>
      <a class="related-item" href="salary-delete-simulator.html">
        <span class="emoji">💸</span><span class="txt">월급 삭제 시뮬레이터</span>
      </a>
    </div>
  </div>

  <a class="footer-link" href="../index.html">CBM Lab의 다른 무역 도구 보기 →</a>
</div>

<script>
const factorMeta = {
  salary: { reason: "월급", getText: v => ({4:"부족한 월급",2:"그럭저럭인 월급",0:"만족스러운 월급"}[v]) },
  overtime: { reason: "야근", getText: v => ({0:"야근 없음",1:"주 1~2회 야근",2:"주 3~4회 야근",4:"거의 매일 야근"}[v]) },
  leave: { reason: "연차 눈치", getText: v => ({0:"연차 자유롭게 사용",2:"연차 눈치 보며 사용",4:"연차 거의 못 씀"}[v]) },
  boss: { reason: "상사", getText: v => ({0:"괜찮은 상사",1:"방임형 상사",3:"마이크로매니징 상사",4:"폭언성 상사"}[v]) },
  commute: { reason: "통근시간", getText: v => ({0:"짧은 통근시간",1:"보통 통근시간",2:"긴 통근시간",4:"매우 긴 통근시간"}[v]) },
  jobsearch: { reason: "이직 관심도", getText: v => ({0:"이직 생각 없음",1:"가끔 공고 봄",2:"자주 공고 봄",4:"매일 공고 봄"}[v]) },
  vision: { reason: "회사 비전", getText: v => ({0:"회사 비전에 확신",2:"회사 비전 잘 모름",4:"회사 비전에 확신 없음"}[v]) }
};

const tiers = [
  { max: 20, emoji: "🙂", name: "아직 다닐만함", line: "이 정도면 회사 생활 나쁘지 않은 편이에요." },
  { max: 45, emoji: "🤔", name: "슬슬 고민중", line: "머릿속 한켠에 사직서 초안이 저장되어 있을지도 몰라요." },
  { max: 70, emoji: "😮‍💨", name: "마음은 이미 퇴사", line: "몸은 회사에, 마음은 이미 다른 곳에 가 있는 상태예요." },
  { max: 100, emoji: "📝", name: "사직서 초안 저장완료", line: "이 정도면 진지하게 다음 스텝을 생각해볼 타이밍일 수도 있어요." }
];

function showResult(){
  const values = {};
  let total = 0;
  const maxPerItem = { salary:4, overtime:4, leave:4, boss:4, commute:4, jobsearch:4, vision:4 };
  const maxTotal = Object.values(maxPerItem).reduce((a,b)=>a+b,0);

  for(const key of Object.keys(factorMeta)){
    const v = Number(document.getElementById(key).value);
    values[key] = v;
    total += v;
  }

  const pct = Math.round(total / maxTotal * 100);
  const tier = tiers.find(t => pct <= t.max);

  const sorted = Object.entries(values).sort((a,b) => b[1]-a[1]);
  const topKey = sorted[0][0];
  const topReason = factorMeta[topKey].reason;

  document.getElementById('resultEmoji').textContent = tier.emoji;
  document.getElementById('resultTier').textContent = tier.name;
  document.getElementById('resultPct').innerHTML = pct + '<span>% 퇴사 확률</span>';
  document.getElementById('resultReason').textContent = "사유: " + topReason + " 때문입니다";
  document.getElementById('resultLine').textContent = tier.line;
  document.getElementById('meterFill').style.width = pct + '%';

  const topFactors = sorted.filter(([k,v]) => v > 0).slice(0, 3);
  const factorsList = document.getElementById('factorsList');
  if(topFactors.length === 0){
    factorsList.innerHTML = '<div class="factor-item"><span class="ftxt">특별히 튀는 항목이 없어요. 전반적으로 안정적인 상태예요.</span></div>';
  } else {
    factorsList.innerHTML = topFactors.map(([key, v]) => {
      const scoreClass = v >= 4 ? 'high' : (v >= 2 ? 'mid' : 'low');
      const scoreLabel = v >= 4 ? '심각' : (v >= 2 ? '주의' : '양호');
      return `<div class="factor-item"><span class="ftxt">${factorMeta[key].getText(v)}</span><span class="fscore ${scoreClass}">${scoreLabel}</span></div>`;
    }).join('');
  }

  document.getElementById('resultBox').classList.add('show');
  document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function shareResult(){
  const pct = document.getElementById('resultPct').textContent;
  const reason = document.getElementById('resultReason').textContent;
  const text = `이번 달 퇴사 확률: ${pct} (${reason})`;
  if(navigator.share){
    navigator.share({title:'퇴사 확률 계산기 - 내위치', text: text, url: location.href});
  } else {
    navigator.clipboard.writeText(location.href);
    alert('링크가 복사됐어요! 카톡에 붙여넣기 해보세요.');
  }
}
</script>
</body>
</html>
