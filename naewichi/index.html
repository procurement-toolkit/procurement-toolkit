<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내위치 - 나는 어디쯤일까? | 나와 비교하는 재미있는 통계 랭킹</title>
<meta name="description" content="출퇴근 시간, 커피값, 이직 횟수까지 - 내 나이와 상황을 입력하면 전국 평균과 바로 비교해주는 랭킹 모음. 통계청 공식 데이터 기반, 내위치 by CBM Lab.">
<meta property="og:title" content="내위치 - 나는 전국에서 어디쯤일까?">
<meta property="og:description" content="10초면 나오는 나와 비교 랭킹 모음">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF4FB; --card:#FFFFFF; --ink:#1F3A5F; --ink-soft:#5A7392;
    --coral:#FF8552; --coral-dark:#C85A2C; --mint:#4ECDC4; --mint-dark:#1E8F86;
    --yellow:#FFD166; --line:#D8E7F2;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:480px;margin:0 auto;padding:0 20px 60px;}

  .brandbar{display:flex;align-items:baseline;gap:6px;padding:20px 0 0;}
  .brandbar .b1{font-family:'Jua',sans-serif;font-size:22px;color:var(--ink);}
  .brandbar .b2{font-size:11px;color:var(--ink-soft);}

  .hero{padding:16px 0 4px;}
  .hero h1{font-family:'Jua',sans-serif;font-size:24px;line-height:1.4;margin:0 0 6px;}
  .hero p{font-size:14px;color:var(--ink-soft);margin:0;}

  .weekly{background:var(--card);border-radius:16px;padding:16px 18px;margin:18px 0;border:2px solid var(--line);}
  .weekly p.label{font-size:12px;color:var(--ink-soft);margin:0 0 10px;font-weight:700;}
  .weekly .row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--ink);}
  .weekly .row .cnt{color:var(--ink-soft);}

  .grid{display:flex;flex-direction:column;gap:12px;margin-top:6px;}
  .tile{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border-radius:16px;padding:16px;
    text-decoration:none;color:var(--ink);border:2px solid var(--line);
    box-shadow:0 4px 0 var(--line);
  }
  .tile .emoji{font-size:26px;flex-shrink:0;}
  .tile .txt-title{font-size:15px;font-weight:700;margin:0 0 3px;}
  .tile .txt-sub{font-size:12px;color:var(--ink-soft);margin:0;}
  .tile.soon{opacity:.55;box-shadow:none;}
  .tile.soon .badge-soon{
    margin-left:auto;font-size:11px;background:var(--line);color:var(--ink-soft);
    padding:4px 9px;border-radius:999px;flex-shrink:0;
  }

  .footer-link{display:block;text-align:center;margin-top:26px;font-size:12px;color:var(--ink-soft);text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">

  <div class="brandbar">
    <span class="b1">내위치</span>
    <span class="b2">by CBM Lab</span>
  </div>

  <div class="hero">
    <h1>내가 전국에서<br>어디쯤인지, 10초면 알아요</h1>
    <p>나이랑 상황만 골라보세요</p>
  </div>

  <div class="weekly">
    <p class="label">이번 주 많이 본 랭킹</p>
    <div class="row"><span>1. 내 출퇴근 시간 vs 전국 평균</span><span class="cnt">2,341명</span></div>
    <div class="row"><span>2. 내 커피값 vs 또래 평균</span><span class="cnt">준비중</span></div>
    <div class="row"><span>3. 내 이직 횟수 vs 내 나이대</span><span class="cnt">준비중</span></div>
  </div>

  <div class="grid">
    <a class="tile" href="commute-time-calculator.html">
      <span class="emoji">🚌</span>
      <div>
        <p class="txt-title">내 출퇴근 시간 vs 전국 평균</p>
        <p class="txt-sub">매일 몇 분씩 버리고 있을까</p>
      </div>
    </a>

    <div class="tile soon">
      <span class="emoji">☕</span>
      <div>
        <p class="txt-title">내 커피값 vs 또래 평균</p>
        <p class="txt-sub">한 달에 얼마나 마시는 걸까</p>
      </div>
      <span class="badge-soon">준비중</span>
    </div>

    <div class="tile soon">
      <span class="emoji">💼</span>
      <div>
        <p class="txt-title">내 이직 횟수 vs 내 나이대</p>
        <p class="txt-sub">평균보다 많이 옮겼을까</p>
      </div>
      <span class="badge-soon">준비중</span>
    </div>
  </div>

  <a class="footer-link" href="../index.html">CBM Lab의 다른 무역 도구 보기 →</a>
</div>
</body>
</html>
