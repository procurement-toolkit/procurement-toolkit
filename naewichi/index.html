<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>내위치 - 나는 어디쯤일까? | 나와 비교하는 재미있는 통계 랭킹</title>
<meta name="description" content="출퇴근 시간, 커피값, 이직 횟수까지 - 내 나이와 상황을 입력하면 전국 평균과 바로 비교해주는 랭킹 모음. 통계청 등 공식 데이터 기반, 내위치 by CBM Lab.">
<meta property="og:title" content="내위치 - 나는 전국에서 어디쯤일까?">
<meta property="og:description" content="10초면 나오는 나와 비교 랭킹 모음">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF4FB; --card:#FFFFFF; --ink:#1F3A5F; --ink-soft:#5A7392;
    --coral:#FF8552; --coral-dark:#C85A2C; --mint:#4ECDC4; --mint-dark:#1E8F86;
    --yellow:#FFD166; --line:#D8E7F2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:480px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom));}

  .brandbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:baseline;gap:6px;
    padding:calc(14px + env(safe-area-inset-top)) 0 12px;
    background:linear-gradient(var(--bg) 80%, transparent);
  }
  .brandbar .b1{font-family:'Jua',sans-serif;font-size:21px;color:var(--ink);}
  .brandbar .b2{font-size:11px;color:var(--ink-soft);}

  .hero{padding:2px 0 10px;}
  .hero h1{font-family:'Jua',sans-serif;font-size:23px;line-height:1.4;margin:0 0 6px;}
  .hero p{font-size:14px;color:var(--ink-soft);margin:0;}

  .search-box{position:relative;margin:14px 0 6px;}
  .search-box input{
    width:100%;padding:13px 16px 13px 42px;font-size:15px;
    font-family:'Noto Sans KR',sans-serif;border:2px solid var(--line);
    border-radius:14px;background:var(--card);color:var(--ink);
  }
  .search-box input:focus{outline:none;border-color:var(--coral);}
  .search-box input::placeholder{color:#A7BBCF;}
  .search-box .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.6;}

  .chips-wrap{margin:0;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 6px;}
  .chip{
    flex-shrink:0;padding:8px 14px;border-radius:999px;background:var(--card);
    border:2px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-soft);
    cursor:pointer;white-space:nowrap;user-select:none;
  }
  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}

  .grid{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .tile{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border-radius:16px;padding:14px 16px;
    text-decoration:none;color:var(--ink);border:2px solid var(--line);
    box-shadow:0 4px 0 var(--line);
    min-height:60px;
    transition:transform .08s;
  }
  .tile:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line);}
  .tile .emoji{font-size:24px;flex-shrink:0;width:32px;text-align:center;}
  .tile .txt-title{font-size:14.5px;font-weight:700;margin:0 0 2px;line-height:1.3;}
  .tile .txt-sub{font-size:12px;color:var(--ink-soft);margin:0;}
  .tile .arrow{margin-left:auto;font-size:14px;color:var(--line);flex-shrink:0;}

  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13px;}

  .footer-link{
    display:block;text-align:center;margin-top:30px;padding:14px;
    font-size:13px;color:var(--ink-soft);text-decoration:none;
    background:var(--card);border-radius:14px;border:2px solid var(--line);
  }

  .count-note{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:14px;}
</style>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="wrap">

  <div class="brandbar">
    <span class="b1">내위치</span>
    <span class="b2">by CBM Lab</span>
  </div>

  <div class="hero">
    <h1>내가 전국에서<br>어디쯤인지, 10초면 알아요</h1>
    <p>궁금한 걸 검색하거나 골라보세요</p>
  </div>

  <div class="search-box">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="예: 커피, 출퇴근, 연봉..." oninput="renderTiles()">
  </div>

  <div class="chips-wrap">
    <div class="chips" id="chipRow"></div>
  </div>

  <div id="tileArea"></div>

  <p class="count-note" id="countNote"></p>

  <a class="footer-link" href="../index.html">🧰 CBM Lab의 다른 무역 도구 보기</a>
</div>

<script>
// ============================================================
// 콘텐츠 DB는 items.json에서 불러옵니다.
// GitHub Actions가 Vercel Analytics API로 조회수를 가져와서
// 이 JSON 파일의 views 값만 자동으로 갱신합니다.
// ============================================================
let items = [];
let categories = [{ id:"all", label:"전체", emoji:"✨" }];

let activeCat = "all";

function renderChips(){
  const row = document.getElementById('chipRow');
  row.innerHTML = categories.map(c =>
    `<div class="chip ${c.id===activeCat?'active':''}" onclick="setCat('${c.id}')">${c.emoji} ${c.label}</div>`
  ).join('');
}

function setCat(id){
  activeCat = id;
  renderChips();
  renderTiles();
}

function renderTiles(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let filtered = items.filter(it => activeCat === "all" || it.cat === activeCat);
  if(q){
    filtered = filtered.filter(it => (it.title + it.sub).toLowerCase().includes(q));
  }
  // 조회수(views) 높은 순으로 정렬 - 실제 데이터 연결 전까지는 동일값이라 등록 순서 유지
  filtered = filtered.slice().sort((a,b) => b.views - a.views);

  const area = document.getElementById('tileArea');
  const note = document.getElementById('countNote');

  if(filtered.length === 0){
    area.innerHTML = `<div class="empty-state">🙈 아직 이 조건에 맞는 랭킹이 없어요<br>계속 새로 만들고 있으니 다음에 또 와주세요</div>`;
    note.textContent = "";
    return;
  }

  area.innerHTML = `<div class="grid">` + filtered.map(it =>
    `<a class="tile" href="${it.url}">
      <span class="emoji">${it.emoji}</span>
      <div>
        <p class="txt-title">${it.title}</p>
        <p class="txt-sub">${it.sub}</p>
      </div>
      <span class="arrow">›</span>
    </a>`
  ).join('') + `</div>`;

  note.textContent = `현재 ${items.length}개 랭킹 운영 중 · 계속 추가돼요`;
}

async function init(){
  try{
    const res = await fetch('items.json', { cache: 'no-store' });
    const data = await res.json();
    items = data.items || [];
    categories = data.categories || categories;
  } catch(e){
    // items.json을 못 불러와도 빈 상태로 안전하게 표시
    items = [];
  }
  renderChips();
  renderTiles();
}
init();
</script>
</body>
</html>
