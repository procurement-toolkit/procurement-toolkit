<style>

    --bg:#2B1B4E; --card:#3D2A66; --ink:#F5EFFF; --ink-soft:#B9A8DE;
    --coral:#F4C95D; --coral-dark:#D9A62E; --mint:#7EE8C6; --mint-dark:#3FBF9C;
    --yellow:#F4C95D; --line:#4E3A82;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Noto Sans KR', sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:480px;margin:0 auto;padding:0 20px 60px;}
  .brandbar{display:flex;align-items:baseline;gap:6px;padding:18px 0 0;text-decoration:none;}
  .brandbar .b1{font-family:'Jua',sans-serif;font-size:20px;color:var(--ink);}
  .brandbar .b2{font-size:11px;color:var(--ink-soft);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);margin-bottom:6px;}
  select{
    width:100%;padding:12px 14px;font-size:15px;font-family:'Noto Sans KR',sans-serif;
    border:2px solid var(--line);border-radius:12px;background:#291a4a;color:var(--ink);
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%23B9A8DE' stroke-width='2' fill='none'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;
  }
  select:focus{outline:none;border-color:var(--coral);}
  .go-btn{
    width:100%;padding:14px;margin-top:6px;background:var(--coral);color:#3A2A00;border:none;
    border-radius:14px;font-family:'Jua',sans-serif;font-size:17px;cursor:pointer;
    box-shadow:0 5px 0 var(--coral-dark);transition:transform .05s;
  }
  .go-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--coral-dark);}
  .result{display:none;margin-top:20px;}
  .result.show{display:block;}
  .headline-result{text-align:center;font-family:'Jua',sans-serif;font-size:20px;color:var(--ink);margin-bottom:4px;line-height:1.5;}
  .sub-result{text-align:center;font-size:13px;color:var(--ink-soft);margin-bottom:18px;}
  .score-row{margin-bottom:14px;}
  .score-label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px;}
  .score-label .pct{color:var(--coral);}
  .score-bar{position:relative;height:14px;background:var(--bg);border-radius:7px;border:2px solid var(--line);overflow:hidden;}
  .score-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--mint),var(--coral));transition:width .8s cubic-bezier(.34,1.56,.64,1);}
  .lucky-row{display:flex;gap:10px;margin-top:16px;}
  .lucky-box{flex:1;background:var(--bg);border-radius:12px;padding:10px;text-align:center;border:2px solid var(--line);}
  .lucky-box .lb{font-size:11px;color:var(--ink-soft);margin:0 0 4px;}
  .lucky-box .lv{font-size:15px;font-weight:700;color:var(--ink);margin:0;}
  .share-btn{
    width:100%;padding:13px;margin-top:16px;background:#291a4a;color:var(--ink);
    border:2px solid var(--line);border-radius:14px;font-family:'Noto Sans KR',sans-serif;
    font-weight:700;font-size:14px;cursor:pointer;
  }
  .disclaimer{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:12px;line-height:1.6;}
  .related{margin-top:28px;}
  .related h3{font-family:'Jua',sans-serif;font-size:15px;margin:0 0 10px;color:var(--ink-soft);}
  .related-grid{display:flex;flex-direction:column;gap:8px;}
  .related-item{
    display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;
    padding:12px 14px;text-decoration:none;color:var(--ink);border:2px solid var(--line);
  }
  .related-item .emoji{font-size:20px;}
  .related-item .txt{font-size:13px;font-weight:500;}
  .footer-link{display:block;text-align:center;margin-top:26px;font-size:12px;color:var(--ink-soft);text-decoration:none;}
</style>

<body>
<div class="wrap">

  <a class="brandbar" href="index.html">
    <span class="b1">내위치</span>

  </a>

  <div class="hero">
    <h1>오늘의 운세,<br>내 띠는 어떨까?</h1>

  </div>

  <div class="date-tag" id="dateTag"></div>

  <div class="card">
    <h2>나는 이래요</h2>
    <div class="field">

      <select id="calType" onchange="toggleLeap()">
        <option value="solar" selected>양력</option>

    </div>
    <div class="field" id="leapWrap" style="display:none;">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <input type="checkbox" id="isLeap" style="width:16px;height:16px;">
        <span style="font-size:13px;color:var(--ink-soft);">윤달로 태어났어요</span>

    </div>
    <div class="field">
      <label>생년월일</label>

    <div class="field">
      <label for="gender">성별</label>

        <option value="m">남성</option>

        <option value="n">비공개</option>

    </div>
    <button class="go-btn" onclick="showResult()">오늘의 운세 보기 →</button>

    <div class="result" id="resultBox">
      <div class="mascot" id="mascotEmoji"></div>

      <div class="score-row">
        <div class="score-label"><span>💰 재물운</span><span class="pct" id="moneyPct"></span></div>

      <div class="score-row">
        <div class="score-label"><span>💕 애정운</span><span class="pct" id="lovePct"></span></div>

      </div>
      <div class="score-row">
        <div class="score-label"><span>💪 건강운</span><span class="pct" id="healthPct"></span></div>

      <div class="score-row">

      </div>

      <div class="lucky-row">
        <div class="lucky-box"><p class="lb">행운의 색</p><p class="lv" id="luckyColor"></p></div>
        <div class="lucky-box"><p class="lb">행운의 숫자</p><p class="lv" id="luckyNumber"></p></div>
      </div>

      <button class="share-btn" onclick="shareResult()">📤 카톡으로 오늘 운세 공유하기</button>
      <p class="disclaimer">🔮 재미로 보는 콘텐츠입니다. 매일 자정 기준으로 새로 갱신돼요.</p>
    </div>
  </div>

  <div class="related">

    <div class="related-grid">
      <a class="related-item" href="zodiac-compatibility-calculator.html">
        <span class="emoji">💞</span><span class="txt">띠 궁합 보기</span>
      </a>
      <a class="related-item" href="commute-time-calculator.html">
        <span class="emoji">🚌</span><span class="txt">내 출퇴근 시간 vs 전국 평균</span>
      </a>
    </div>
  </div>

  <a class="footer-link" href="../index.html">CBM Lab의 다른 무역 도구 보기 →</a>
</div>

<script src="lib/solarlunar.min.js"></script>
<script>
const animals = ["쥐","소","호랑이","토끼","용","뱀","말","양","원숭이","닭","개","돼지"];
const emojiMap = {"쥐":"🐭","소":"🐮","호랑이":"🐯","토끼":"🐰","용":"🐉","뱀":"🐍","말":"🐴","양":"🐐","원숭이":"🐒","닭":"🐔","개":"🐶","돼지":"🐷"};

function yearToAnimal(year){
  const idx = (((year % 12) - 4) + 12) % 12;
  return animals[idx];
}

// 출생연도/월/일 셀렉트 옵션 채우기
const yearSelect = document.getElementById('birthYear');
const monthSelect = document.getElementById('birthMonth');
const daySelect = document.getElementById('birthDay');
const nowYear = new Date().getFullYear();

for(let y = nowYear - 10; y >= nowYear - 85; y--){
  const opt = document.createElement('option');
  opt.value = y; opt.textContent = y + "년";
  if(y === nowYear - 28) opt.selected = true;
  yearSelect.appendChild(opt);
}
for(let m = 1; m <= 12; m++){
  const opt = document.createElement('option');
  opt.value = m; opt.textContent = m + "월";
  if(m === 6) opt.selected = true;
  monthSelect.appendChild(opt);
}
function rebuildDayOptions(){
  const month = Number(monthSelect.value);
  const calType = document.getElementById('calType').value;
  // 음력은 항상 1~30일, 양력은 월별 일수(윤년 고려 없이 2월은 28일까지로 안전하게 제한)
  const maxDay = calType === 'lunar' ? 30 : ([4,6,9,11].includes(month) ? 30 : (month===2 ? 28 : 31));
  const prevVal = daySelect.value;
  daySelect.innerHTML = '';
  for(let d = 1; d <= maxDay; d++){
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d + "일";
    if(d === 15) opt.selected = true;
    daySelect.appendChild(opt);
  }
  if(prevVal && Number(prevVal) <= maxDay) daySelect.value = prevVal;
}
monthSelect.addEventListener('change', rebuildDayOptions);
document.getElementById('calType').addEventListener('change', rebuildDayOptions);
rebuildDayOptions();

function toggleLeap(){
  const calType = document.getElementById('calType').value;
  document.getElementById('leapWrap').style.display = calType === 'lunar' ? 'block' : 'none';
}

// 정확한 띠 계산: 양력이면 음력으로 변환한 뒤의 '음력 연도' 기준으로 계산해야 정확합니다
// (설 전에 태어난 1~2월생은 전년도 띠가 될 수 있음)
function getLunarYear(calType, y, m, d, isLeap){
  if(calType === 'lunar'){
    return y; // 이미 음력이면 입력한 연도가 곧 음력 연도
  }
  try{
    const lib = (window.solarLunar && window.solarLunar.default) ? window.solarLunar.default : window.solarLunar;
    const r = lib.solar2lunar(y, m, d);
    return r.lYear;
  } catch(e){
    return y; // 변환 실패 시 안전하게 입력 연도로 대체
  }
}

const totalMsgs = [
  "오늘은 뜻밖의 좋은 소식이 들려올 예감이에요",
  "평소보다 조금 더 여유롭게 하루를 보내보세요",
  "작은 결정 하나가 생각보다 큰 변화를 가져올 수 있어요",
  "주변 사람의 말 한마디에 힌트가 숨어있을지도",
  "오늘은 무리하기보다 페이스 조절이 중요한 날이에요",
  "생각보다 술술 풀리는 하루가 될 것 같아요",
  "새로운 걸 시도하기 좋은 기운이 감돌아요",
  "차분하게 정리하면 놓쳤던 게 눈에 들어와요",
  "예상 밖의 인연이나 기회가 스쳐 지나갈 수 있어요",
  "오늘 하루, 나 자신에게 조금 더 관대해져도 좋아요"
];
const moneyMsgs = [
  "지출보다 계획이 앞서면 좋은 하루예요",
  "예상치 못한 작은 수입이 생길 수 있어요",
  "충동구매는 잠시 미뤄두는 게 좋겠어요",
  "투자보다는 저축에 집중하기 좋은 타이밍",
  "돈 관련 대화에서 좋은 제안이 들어올 수 있어요",
  "가계부를 한 번 점검해보면 좋은 날이에요",
  "생각보다 지갑 사정이 넉넉하게 느껴질 거예요",
  "큰돈보다 작은 절약이 빛을 발하는 하루"
];
const loveMsgs = [
  "솔직한 마음 표현이 좋은 결과로 이어져요",
  "오래된 인연에게서 연락이 올 수 있어요",
  "괜히 서운해하기보다 먼저 다가가보세요",
  "혼자만의 시간도 충분히 의미 있는 하루예요",
  "작은 오해는 대화로 쉽게 풀릴 거예요",
  "설레는 만남의 기운이 살짝 스쳐 지나가요",
  "지금의 관계에 감사하는 마음이 커지는 날",
  "연애운보다 우정운이 더 반짝이는 하루"
];
const healthMsgs = [
  "무리한 일정보다 휴식을 우선하세요",
  "가벼운 산책이 컨디션 회복에 도움될 거예요",
  "수분 섭취를 평소보다 신경 써보세요",
  "생각보다 활력이 넘치는 하루가 될 거예요",
  "목과 어깨 스트레칭, 오늘 꼭 챙기세요",
  "숙면이 오늘의 가장 중요한 처방이에요",
  "과식만 조심하면 무탈하게 지나갈 하루",
  "컨디션 난조는 오전에만 있고 오후엔 회복돼요"
];
const colors = ["코랄", "민트", "네이비", "라벤더", "골드", "레몬옐로우", "버건디", "스카이블루"];

function hashStr(str){
  let h = 0;
  for(let i=0;i<str.length;i++){
    h = (h*31 + str.charCodeAt(i)) | 0;
  }
  return Math.abs(h);
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}

function pick(arr, seed){
  return arr[hashStr(seed) % arr.length];
}

function pctFor(seed){
  return 55 + (hashStr(seed) % 46); // 55~100 사이
}

const today = todayStr();
document.getElementById('dateTag').textContent = "📅 " + today + " 기준 오늘의 운세";

function readBirthInput(){
  const calType = document.getElementById('calType').value;
  const y = Number(yearSelect.value);
  const m = Number(monthSelect.value);
  const d = Number(daySelect.value);
  const isLeap = document.getElementById('isLeap').checked;
  const lunarYear = getLunarYear(calType, y, m, d, isLeap);
  const animal = yearToAnimal(lunarYear);
  return { calType, y, m, d, isLeap, animal };
}

function showResult(){
  const { y, m, d, calType, animal } = readBirthInput();
  const gender = document.getElementById('gender').value;
  const baseSeed = today + animal + y + m + d + calType + gender;

  document.getElementById('mascotEmoji').textContent = emojiMap[animal];
  document.getElementById('headlineText').textContent = y+"년 "+m+"월 "+d+"일생 "+animal+"띠, 오늘의 운세";
  document.getElementById('subText').textContent = pick(totalMsgs, baseSeed+"total");

  const moneyP = pctFor(baseSeed+"money");
  const loveP = pctFor(baseSeed+"love");
  const healthP = pctFor(baseSeed+"health");
  const totalP = Math.round((moneyP+loveP+healthP)/3);

  document.getElementById('moneyPct').textContent = moneyP+"%";
  document.getElementById('lovePct').textContent = loveP+"%";
  document.getElementById('healthPct').textContent = healthP+"%";
  document.getElementById('totalPct').textContent = totalP+"%";

  document.getElementById('moneyFill').style.width = moneyP+"%";
  document.getElementById('loveFill').style.width = loveP+"%";
  document.getElementById('healthFill').style.width = healthP+"%";
  document.getElementById('totalFill').style.width = totalP+"%";

  document.getElementById('luckyColor').textContent = pick(colors, baseSeed+"color");
  document.getElementById('luckyNumber').textContent = (hashStr(baseSeed+"number") % 9) + 1;

  document.getElementById('resultBox').classList.add('show');
}

function shareResult(){
  const { animal } = readBirthInput();
  if(navigator.share){
    navigator.share({title:'오늘의 운세 - 내위치', text: animal+'띠 오늘의 운세를 확인해보세요', url: location.href});
  } else {
    navigator.clipboard.writeText(location.href);
    alert('링크가 복사됐어요! 카톡에 붙여넣기 해보세요.');
  }
}
</script>
</body>
</html>
