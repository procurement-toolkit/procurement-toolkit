<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 반려동물 양육비 계산기 - 평균과 비교해보기 | 내위치</title>
<meta name="description" content="반려견·반려묘 월평균 양육비를 입력하면 전국 평균과 바로 비교해드려요. 농림축산식품부 2025년 반려동물 양육현황조사(국가승인통계) 데이터 기반.">
<meta property="og:title" content="내 반려동물 양육비, 평균과 비교하면?">
<meta property="og:description" content="입력하면 바로 비교되는 반려동물 양육비 계산기 - 내위치">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF3E6; --card:#FFFFFF; --ink:#6B4226; --ink-soft:#A67C52;
    --coral:#FF9A52; --coral-dark:#D97524; --mint:#7FBF7F; --mint-dark:#4F9E4F;
    --yellow:#FFD166; --line:#F5E1CC;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Noto Sans KR', sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:480px;margin:0 auto;padding:0 20px 60px;}
  .brandbar{display:flex;align-items:baseline;gap:6px;padding:18px 0 0;text-decoration:none;}
  .brandbar .b1{font-family:'Jua',sans-serif;font-size:20px;color:var(--ink);}
  .brandbar .b2{font-size:11px;color:var(--ink-soft);}
  .hero{text-align:center;padding:18px 0 8px;}
  .hero h1{font-family:'Jua',sans-serif;font-size:26px;line-height:1.4;margin:0 0 6px;color:var(--ink);}
  .hero p{font-size:14px;color:var(--ink-soft);margin:0;}
  .mascot{display:block;margin:14px auto 4px;width:200px;height:140px;}
  .card{background:var(--card);border-radius:20px;padding:22px 20px;margin-top:18px;box-shadow:0 6px 0 var(--line);}
  .card h2{font-family:'Jua',sans-serif;font-size:17px;margin:0 0 14px;color:var(--ink);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);margin-bottom:6px;}
  select{
    width:100%;padding:12px 14px;font-size:15px;font-family:'Noto Sans KR',sans-serif;
    border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%23A67C52' stroke-width='2' fill='none'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;
  }
  select:focus{outline:none;border-color:var(--coral);}
  .go-btn{
    width:100%;padding:14px;margin-top:6px;background:var(--coral);color:#fff;border:none;
    border-radius:14px;font-family:'Jua',sans-serif;font-size:17px;cursor:pointer;
    box-shadow:0 5px 0 var(--coral-dark);transition:transform .05s;
  }
  .go-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--coral-dark);}
  .result{display:none;margin-top:20px;}
  .result.show{display:block;}
  .headline-result{text-align:center;font-family:'Jua',sans-serif;font-size:22px;color:var(--ink);margin-bottom:6px;line-height:1.5;}
  .headline-result .num{color:var(--coral-dark);font-size:28px;}
  .sub-result{text-align:center;font-size:13px;color:var(--ink-soft);margin-bottom:20px;}
  .track-row{margin-bottom:16px;}
  .track-label{display:flex;justify-content:space-between;font-size:13px;font-weight:500;margin-bottom:6px;}
  .track-label .me{color:var(--coral-dark);}
  .track-label .avg{color:var(--mint-dark);}
  .track{position:relative;height:34px;background:var(--bg);border-radius:17px;border:2px solid var(--line);overflow:visible;}
  .track-fill{
    position:absolute;left:0;top:0;bottom:0;border-radius:17px;
    display:flex;align-items:center;justify-content:flex-end;padding-right:10px;
    font-size:12px;font-weight:700;color:#fff;transition:width .8s cubic-bezier(.34,1.56,.64,1);
  }
  .track-fill.me{background:var(--coral);}
  .track-fill.avg{background:var(--mint);}
  .track-icon{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:20px;}
  .badge{
    display:inline-block;background:var(--yellow);color:#7A5A00;font-size:12px;font-weight:700;
    padding:5px 12px;border-radius:999px;margin:0 auto 14px;display:table;
  }
  .why-box{background:var(--bg);border-radius:14px;padding:16px;margin:18px 0;border:2px dashed var(--line);}
  .why-box .why-title{font-family:'Jua',sans-serif;font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:6px;}
  .why-box p.why-text{font-size:13px;line-height:1.7;margin:0;}
  .share-btn{
    width:100%;padding:13px;margin-top:6px;background:#fff;color:var(--ink);
    border:2px solid var(--line);border-radius:14px;font-family:'Noto Sans KR',sans-serif;
    font-weight:700;font-size:14px;cursor:pointer;
  }
  .source{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:12px;line-height:1.6;}
  .related{margin-top:28px;}
  .related h3{font-family:'Jua',sans-serif;font-size:15px;margin:0 0 10px;color:var(--ink-soft);}
  .related-grid{display:flex;flex-direction:column;gap:8px;}
  .related-item{
    display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;
    padding:12px 14px;text-decoration:none;color:var(--ink);border:2px solid var(--line);
  }
  .related-item .emoji{font-size:20px;}
  .related-item .txt{font-size:13px;font-weight:500;}
  .footer-link{display:block;text-align:center;margin-top:26px;font-size:12px;color:var(--ink-soft);text-decoration:none;}
</style>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="wrap">

  <a class="brandbar" href="index.html">
    <span class="b1">내위치</span>
    <span class="b2">by CBM Lab</span>
  </a>

  <div class="hero">
    <h1>내 반려동물 양육비,<br>평균과 비교하면?</h1>
    <p>어떤 아이인지, 월 지출만 골라봐요</p>
  </div>

  <svg class="mascot" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="강아지와 고양이가 함께 있는 귀여운 캐릭터 일러스트">
    <ellipse cx="100" cy="128" rx="70" ry="7" fill="#F5E1CC"/>
    <ellipse cx="75" cy="90" rx="30" ry="26" fill="#D9A366"/>
    <ellipse cx="58" cy="70" rx="10" ry="16" fill="#D9A366" transform="rotate(-20 58 70)"/>
    <ellipse cx="92" cy="70" rx="10" ry="16" fill="#D9A366" transform="rotate(20 92 70)"/>
    <circle cx="66" cy="90" r="3" fill="#6B4226"/>
    <circle cx="84" cy="90" r="3" fill="#6B4226"/>
    <ellipse cx="75" cy="98" rx="6" ry="4" fill="#6B4226"/>
    <ellipse cx="140" cy="95" rx="26" ry="22" fill="#B8B8B8"/>
    <polygon points="120,78 128,60 136,80" fill="#B8B8B8"/>
    <polygon points="160,78 152,60 144,80" fill="#B8B8B8"/>
    <circle cx="132" cy="95" r="2.5" fill="#3A3A3A"/>
    <circle cx="148" cy="95" r="2.5" fill="#3A3A3A"/>
    <path d="M128 102 q12 6 24 0" fill="none" stroke="#3A3A3A" stroke-width="2" stroke-linecap="round"/>
  </svg>

  <div class="card">
    <h2>나는 이래요</h2>
    <div class="field">
      <label for="petType">반려동물 종류</label>
      <select id="petType">
        <option value="dog">반려견</option>
        <option value="cat">반려묘</option>
        <option value="other">기타 (어류 등)</option>
      </select>
    </div>
    <div class="field">
      <label for="lifeStage">나이 (생애주기)</label>
      <select id="lifeStage">
        <option value="baby">1세 미만 (아기)</option>
        <option value="young" selected>1~2세 (어린 성체)</option>
        <option value="middle">3~5세 (중장년기)</option>
        <option value="senior">6세 이상 (노년기)</option>
      </select>
    </div>
    <div class="field">
      <label for="cost">한 마리당 월평균 지출</label>
      <select id="cost">
        <option value="3">3만원 이하</option>
        <option value="7">5~9만원</option>
        <option value="12" selected>10~14만원</option>
        <option value="17">15~19만원</option>
        <option value="25">20~29만원</option>
        <option value="35">30만원 이상</option>
      </select>
    </div>
    <button class="go-btn" onclick="showResult()">비교해보기 →</button>

    <div class="result" id="resultBox">
      <div class="badge" id="badgeText"></div>
      <div class="headline-result" id="headlineText"></div>
      <div class="sub-result" id="subText"></div>

      <div class="track-row">
        <div class="track-label"><span class="me">나</span><span id="meMin"></span></div>
        <div class="track" id="meTrack">
          <div class="track-fill me" id="meFill"><span class="track-icon">🐾</span></div>
        </div>
      </div>
      <div class="track-row">
        <div class="track-label"><span class="avg" id="avgLabel">같은 종류 평균</span><span id="avgMin"></span></div>
        <div class="track" id="avgTrack">
          <div class="track-fill avg" id="avgFill"><span class="track-icon">📊</span></div>
        </div>
      </div>

      <div class="why-box">
        <p class="why-title">💡 왜 이런 결과가 나왔을까요?</p>
        <p class="why-text" id="whyText"></p>
      </div>

      <button class="share-btn" onclick="shareResult()">📤 카톡으로 결과 자랑하기</button>
      <p class="source">출처: 농림축산식품부 「2025년 반려동물 양육현황조사」(국가승인통계, 2026.2 발표), KB금융지주 「2025 한국반려동물 보고서」 생애주기별 치료비 분석</p>
    </div>
  </div>

  <div class="related">
    <h3>다른 사람들이 본 랭킹</h3>
    <div class="related-grid">
      <a class="related-item" href="dining-expense-calculator.html">
        <span class="emoji">🍽️</span><span class="txt">내 외식비 vs 또래 평균</span>
      </a>
      <a class="related-item" href="ott-subscription-calculator.html">
        <span class="emoji">📺</span><span class="txt">내 OTT 구독 개수 vs 전국 평균</span>
      </a>
    </div>
  </div>

  <a class="footer-link" href="../index.html">CBM Lab의 다른 무역 도구 보기 →</a>
</div>

<script>
// 농림축산식품부 2025년 반려동물 양육현황조사(국가승인통계) 기반, 마리당 월평균 양육비(만원)
const avgByType = { dog: 13.5, cat: 9.2, other: 12.1 };
const typeLabel = { dog: "반려견", cat: "반려묘", other: "반려동물 전체" };
const lifeStageLabel = { baby: "1세 미만", young: "1~2세", middle: "3~5세", senior: "6세 이상" };
// KB금융 반려동물 보고서에서 '중장년기(3~4세)'와 '노년기(6~7세) 이후' 치료비가 크게 증가한다고 분석
// 이를 반영해 생애주기별 배율을 추정 적용 (아기 활발한 예방접종·용품비 vs 노년기 치료비 급증)
const lifeStageRatio = { baby: 1.08, young: 1.0, middle: 1.12, senior: 1.35 };

function showResult(){
  const type = document.getElementById('petType').value;
  const lifeStage = document.getElementById('lifeStage').value;
  const myCost = Number(document.getElementById('cost').value);
  const avg = Math.round(avgByType[type] * lifeStageRatio[lifeStage] * 10) / 10;
  const diff = myCost - avg;

  const badge = document.getElementById('badgeText');
  const headline = document.getElementById('headlineText');
  const sub = document.getElementById('subText');
  const why = document.getElementById('whyText');

  let badgeMsg, headMsg, subMsg;
  if(Math.abs(diff) <= 2){
    badgeMsg = "딱 평균 집사"; headMsg = `${typeLabel[type]} 평균과 <span class="num">비슷해요</span>`;
    subMsg = "무난한 반려 생활을 하고 계시네요.";
  } else if(diff < -2){
    badgeMsg = "알뜰 집사"; headMsg = `${typeLabel[type]} 평균보다 <span class="num">${Math.abs(diff).toFixed(1)}만원</span> 적어요`;
    subMsg = "효율적으로 잘 챙기고 계시는 편이에요.";
  } else if(diff <= 10){
    badgeMsg = "정성 가득 집사"; headMsg = `${typeLabel[type]} 평균보다 <span class="num">${diff.toFixed(1)}만원</span> 많아요`;
    subMsg = "그만큼 아이에게 신경을 많이 쓰고 계시네요.";
  } else {
    badgeMsg = "상전 모시는 집사"; headMsg = `${typeLabel[type]} 평균보다 <span class="num">${diff.toFixed(1)}만원</span>이나 많아요`;
    subMsg = "이 정도면 반려동물이 상전이라고 봐도 될 것 같아요.";
  }

  badge.textContent = badgeMsg;
  headline.innerHTML = headMsg;
  sub.textContent = subMsg;
  document.getElementById('avgLabel').textContent = typeLabel[type]+' · '+lifeStageLabel[lifeStage]+' 평균';

  document.getElementById('meMin').textContent = myCost+'만원';
  document.getElementById('avgMin').textContent = avg+'만원';

  const maxScale = Math.max(myCost, avg, 15) * 1.2;
  document.getElementById('meFill').style.width = (myCost/maxScale*100)+'%';
  document.getElementById('avgFill').style.width = (avg/maxScale*100)+'%';

  if(type === 'dog'){
    why.textContent = `농식품부 조사에서 반려견 양육비(13.5만원)가 반려묘(9.2만원)보다 높은 이유는, 개는 산책·미용·훈련 등 관리해야 할 항목이 상대적으로 더 많기 때문이에요. 사료·간식비가 전체 지출의 35% 이상을 차지하는 것도 공통적인 특징이에요. 여기에 KB금융 반려동물 보고서를 보면 중장년기(3~4세)와 노년기(6~7세) 이후 치료비가 크게 늘어나는 경향이 있어서, ${lifeStageLabel[lifeStage]} 구간의 배율을 반영했어요.`;
  } else if(type === 'cat'){
    why.textContent = `반려묘의 양육비가 반려견보다 낮게 나타나는 이유는, 고양이는 산책이나 미용 같은 정기 서비스 비용이 상대적으로 적게 들기 때문이에요. 다만 병원비(사고·상해·질병 치료)는 나이가 들수록 급격히 늘어나는 경향이 있어서, ${lifeStageLabel[lifeStage]} 구간의 배율을 반영했어요.`;
  } else {
    why.textContent = `반려동물 전체 평균(12.1만원)은 사료·간식비가 절반 가까이를 차지하고, 병원비와 미용·위생관리비가 그 뒤를 이어요. 최근에는 돌봄·훈련 서비스 지출 비중도 꾸준히 늘어나는 추세예요. 나이가 들수록 치료비 비중이 커지는 경향도 반영해서 ${lifeStageLabel[lifeStage]} 구간의 배율을 적용했어요.`;
  }

  document.getElementById('resultBox').classList.add('show');
}

function shareResult(){
  const text = document.getElementById('headlineText').textContent;
  if(navigator.share){
    navigator.share({title:'내 반려동물 양육비 비교 - 내위치', text: '내 반려동물 양육비: ' + text, url: location.href});
  } else {
    navigator.clipboard.writeText(location.href);
    alert('링크가 복사됐어요! 카톡에 붙여넣기 해보세요.');
  }
}
</script>
</body>
</html>
