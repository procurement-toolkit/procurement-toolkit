<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>최악의 상사 궁합 테스트 - 나와 최악인 상사 유형은 | 내위치</title>
<meta name="description" content="질문 몇 개만 답하면 나와 궁합이 최악인 상사 유형을 알려드려요. 궁합 점수는 마이너스로 나올 수도 있어요.">
<meta property="og:title" content="당신과 최악의 궁합인 상사 유형은?">
<meta property="og:description" content="10초면 나오는 최악의 상사 궁합 테스트 - 내위치">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1F1418; --card:#2C1D23; --ink:#F7EDF0; --ink-soft:#BC94A0;
    --coral:#E0466F; --coral-dark:#B82F52; --mint:#46C9E0; --mint-dark:#2E9EB8;
    --yellow:#FFC94D; --line:#402A32;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Noto Sans KR', sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:480px;margin:0 auto;padding:0 20px 60px;}
  .brandbar{display:flex;align-items:baseline;gap:6px;padding:18px 0 0;text-decoration:none;}
  .brandbar .b1{font-family:'Jua',sans-serif;font-size:20px;color:var(--ink);}
  .brandbar .b2{font-size:11px;color:var(--ink-soft);}
  .hero{text-align:center;padding:18px 0 8px;}
  .hero h1{font-family:'Jua',sans-serif;font-size:24px;line-height:1.4;margin:0 0 6px;color:var(--ink);}
  .hero p{font-size:14px;color:var(--ink-soft);margin:0;}
  .card{background:var(--card);border-radius:20px;padding:22px 20px;margin-top:18px;box-shadow:0 6px 0 var(--line);}
  .card h2{font-family:'Jua',sans-serif;font-size:16px;margin:0 0 14px;color:var(--ink);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);margin-bottom:6px;}
  select{
    width:100%;padding:12px 14px;font-size:14.5px;font-family:'Noto Sans KR',sans-serif;
    border:2px solid var(--line);border-radius:12px;background:#221720;color:var(--ink);
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%23BC94A0' stroke-width='2' fill='none'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;
  }
  select:focus{outline:none;border-color:var(--coral);}
  .go-btn{
    width:100%;padding:15px;margin-top:8px;background:var(--coral);color:#fff;border:none;
    border-radius:14px;font-family:'Jua',sans-serif;font-size:18px;cursor:pointer;
    box-shadow:0 5px 0 var(--coral-dark);transition:transform .05s;
  }
  .go-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--coral-dark);}

  .result{display:none;margin-top:22px;}
  .result.show{display:block;}
  .result-card{
    background:linear-gradient(180deg,#331E27,#1F1418);
    border:2px solid var(--line);border-radius:22px;padding:28px 20px;text-align:center;
  }
  .result-emoji{font-size:60px;line-height:1;margin-bottom:8px;}
  .result-tier{font-family:'Jua',sans-serif;font-size:19px;color:var(--ink-soft);margin:0 0 4px;}
  .result-type{font-family:'Jua',sans-serif;font-size:24px;color:var(--ink);margin:2px 0 10px;}
  .result-pct{font-family:'Jua',sans-serif;font-size:44px;color:var(--coral);margin:6px 0;}
  .result-line{font-size:14px;color:var(--ink-soft);margin:8px 0 0;line-height:1.6;}

  .factors{margin-top:22px;}
  .factors h3{font-family:'Jua',sans-serif;font-size:14px;color:var(--ink-soft);margin:0 0 10px;}
  .factor-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--bg);border-radius:12px;padding:11px 14px;margin-bottom:8px;border:1px solid var(--line);
  }
  .factor-item .ftxt{font-size:13px;color:var(--ink);}
  .factor-item .fscore{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;flex-shrink:0;background:#3A1E2C;color:#E0466F;}

  .share-btn{
    width:100%;padding:14px;margin-top:20px;background:var(--mint);color:#062E38;
    border:none;border-radius:14px;font-family:'Jua',sans-serif;font-weight:700;font-size:15px;cursor:pointer;
    box-shadow:0 5px 0 var(--mint-dark);
  }
  .share-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--mint-dark);}
  .disclaimer{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:14px;line-height:1.6;}

  .related{margin-top:28px;}
  .related h3{font-family:'Jua',sans-serif;font-size:15px;margin:0 0 10px;color:var(--ink-soft);}
  .related-grid{display:flex;flex-direction:column;gap:8px;}
  .related-item{
    display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;
    padding:12px 14px;text-decoration:none;color:var(--ink);border:2px solid var(--line);
  }
  .related-item .emoji{font-size:20px;}
  .related-item .txt{font-size:13px;font-weight:500;}
  .footer-link{display:block;text-align:center;margin-top:26px;font-size:12px;color:var(--ink-soft);text-decoration:none;}
</style>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="wrap">

  <a class="brandbar" href="index.html">
    <span class="b1">내위치</span>
    <span class="b2">by CBM Lab</span>
  </a>

  <div class="hero">
    <h1>최악의 상사 궁합 테스트</h1>
    <p>나와 상극인 상사 유형, 미리 알고 피하세요</p>
  </div>

  <div class="card">
    <h2>나는 이런 사람이에요</h2>
    <div class="field">
      <label for="q1">일할 때 나는</label>
      <select id="q1">
        <option value="micro">자율성이 없으면 답답함</option>
        <option value="neglect">가이드가 없으면 불안함</option>
        <option value="mood">감정 기복 있는 사람 앞에서 스트레스 받음</option>
        <option value="compare">남과 비교당하면 예민함</option>
      </select>
    </div>
    <div class="field">
      <label for="q2">보고할 때 나는</label>
      <select id="q2">
        <option value="micro">디테일한 참견을 싫어함</option>
        <option value="neglect">피드백이 없으면 답답함</option>
        <option value="mood">눈치 보며 타이밍을 재는 편</option>
        <option value="compare">결과로 인정받고 싶어함</option>
      </select>
    </div>
    <div class="field">
      <label for="q3">회의 시간에 나는</label>
      <select id="q3">
        <option value="micro">내 방식대로 하고 싶어함</option>
        <option value="neglect">명확한 지시를 원함</option>
        <option value="mood">분위기에 민감하게 반응함</option>
        <option value="compare">다른 팀과 비교되는 걸 싫어함</option>
      </select>
    </div>
    <div class="field">
      <label for="q4">퇴근 후 카톡이 오면</label>
      <select id="q4">
        <option value="micro">간섭받는 느낌이라 싫음</option>
        <option value="neglect">차라리 답이 없는 게 더 스트레스</option>
        <option value="mood">보낸 사람 기분부터 살핌</option>
        <option value="compare">동료도 받았는지부터 확인함</option>
      </select>
    </div>
    <div class="field">
      <label for="q5">일이 잘 안 풀릴 때 나는</label>
      <select id="q5">
        <option value="micro">혼자 해결하고 싶어함</option>
        <option value="neglect">누군가 도와줬으면 함</option>
        <option value="mood">주변 눈치를 많이 봄</option>
        <option value="compare">남들은 어떻게 하는지 신경 쓰임</option>
      </select>
    </div>
    <button class="go-btn" onclick="showResult()">최악의 상사 확인하기 →</button>
  </div>

  <div class="result" id="resultBox">
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji"></div>
      <p class="result-tier">당신과 최악의 궁합은</p>
      <p class="result-type" id="resultType"></p>
      <p class="result-pct" id="resultPct"></p>
      <p class="result-line" id="resultLine"></p>
    </div>

    <div class="factors">
      <h3>💡 이렇게 판단했어요</h3>
      <div id="factorsList"></div>
    </div>

    <button class="share-btn" onclick="shareResult()">📤 카톡으로 결과 공유하기</button>
    <p class="disclaimer">🎭 재미로 보는 성향 테스트입니다.</p>
  </div>

  <div class="related">
    <h3>다른 사람들이 본 랭킹</h3>
    <div class="related-grid">
      <a class="related-item" href="resignation-probability-calculator.html">
        <span class="emoji">📝</span><span class="txt">퇴사 확률 계산기</span>
      </a>
      <a class="related-item" href="kkondae-test.html">
        <span class="emoji">📢</span><span class="txt">나의 꼰대력 테스트</span>
      </a>
    </div>
  </div>

  <a class="footer-link" href="../index.html">CBM Lab의 다른 무역 도구 보기 →</a>
</div>

<script>
const bossTypes = {
  micro: { emoji: "🔍", name: "마이크로매니징 상사", line: "당신은 자율성이 생명인데, 이 상사는 숨쉬는 것까지 확인하고 싶어해요. 도망가세요." },
  neglect: { emoji: "🌫️", name: "방임형 상사", line: "당신은 가이드가 필요한데, 이 상사는 '알아서 해'만 반복해요. 물어볼 사람이 없는 상태예요." },
  mood: { emoji: "🎭", name: "감정기복 심한 상사", line: "당신은 눈치 게임에 지쳐 있는데, 이 상사의 기분은 매일 롤러코스터예요." },
  compare: { emoji: "📊", name: "비교충 상사", line: "당신은 있는 그대로 인정받고 싶은데, 이 상사는 매번 '누구는 이렇게 하던데'를 시전해요." }
};

const questionTexts = {
  q1: { micro: "자율성 중시형", neglect: "가이드 필요형", mood: "감정 민감형", compare: "비교 민감형" },
  q2: { micro: "간섭 싫어함", neglect: "피드백 필요함", mood: "타이밍 재는 편", compare: "결과 인정 원함" },
  q3: { micro: "내 방식 고수", neglect: "명확한 지시 선호", mood: "분위기에 민감", compare: "비교당하기 싫어함" },
  q4: { micro: "간섭 느낌 싫음", neglect: "무응답이 더 스트레스", mood: "상대 기분부터 살핌", compare: "동료 상황부터 확인" },
  q5: { micro: "혼자 해결 선호", neglect: "도움 필요함", mood: "눈치를 많이 봄", compare: "남과 비교하게 됨" }
};

function showResult(){
  const answers = {};
  const counts = { micro: 0, neglect: 0, mood: 0, compare: 0 };

  for(const q of Object.keys(questionTexts)){
    const v = document.getElementById(q).value;
    answers[q] = v;
    counts[v]++;
  }

  const sortedTypes = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  const topType = sortedTypes[0][0];
  const topCount = sortedTypes[0][1];
  const pctScore = -Math.round(topCount / 5 * 100);

  const boss = bossTypes[topType];
  document.getElementById('resultEmoji').textContent = boss.emoji;
  document.getElementById('resultType').textContent = boss.name;
  document.getElementById('resultPct').textContent = "궁합 " + pctScore + "%";
  document.getElementById('resultLine').textContent = boss.line;

  const matchingAnswers = Object.entries(answers).filter(([q,v]) => v === topType);
  const factorsList = document.getElementById('factorsList');
  factorsList.innerHTML = matchingAnswers.map(([q, v]) => {
    return `<div class="factor-item"><span class="ftxt">${questionTexts[q][v]}</span><span class="fscore">일치</span></div>`;
  }).join('');

  document.getElementById('resultBox').classList.add('show');
  document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function shareResult(){
  const type = document.getElementById('resultType').textContent;
  const pct = document.getElementById('resultPct').textContent;
  const text = `나와 최악의 궁합인 상사 유형: ${type} (${pct})`;
  if(navigator.share){
    navigator.share({title:'최악의 상사 궁합 테스트 - 내위치', text: text, url: location.href});
  } else {
    navigator.clipboard.writeText(location.href);
    alert('링크가 복사됐어요! 카톡에 붙여넣기 해보세요.');
  }
}
</script>
</body>
</html>
