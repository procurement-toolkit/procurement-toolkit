<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 커피값 계산기 - 또래 평균 커피 지출과 비교해보기 | 내위치</title>
<meta name="description" content="한 달에 커피값으로 얼마나 쓰는지 입력하면 또래 평균과 바로 비교해드려요. 한국소비자단체협의회·사람인 조사 데이터 기반, 내 커피 지출이 상위 몇 %인지 확인해보세요.">
<meta property="og:title" content="내 한 달 커피값, 또래 평균보다 많을까?">
<meta property="og:description" content="입력하면 바로 비교되는 커피값 계산기 - 내위치">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF3EA; --card:#FFFFFF; --ink:#3E2A1E; --ink-soft:#8A6E58;
    --coral:#C08552; --coral-dark:#8C5A2C; --mint:#4ECDC4; --mint-dark:#1E8F86;
    --yellow:#FFD166; --line:#EBDCC9;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Noto Sans KR', sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:480px;margin:0 auto;padding:0 20px 60px;}

  .brandbar{display:flex;align-items:baseline;gap:6px;padding:18px 0 0;text-decoration:none;}
  .brandbar .b1{font-family:'Jua',sans-serif;font-size:20px;color:var(--ink);}
  .brandbar .b2{font-size:11px;color:var(--ink-soft);}

  .hero{text-align:center;padding:18px 0 8px;}
  .hero h1{font-family:'Jua',sans-serif;font-size:26px;line-height:1.4;margin:0 0 6px;color:var(--ink);}
  .hero p{font-size:14px;color:var(--ink-soft);margin:0;}

  .mascot{display:block;margin:14px auto 4px;width:200px;height:140px;}

  .card{background:var(--card);border-radius:20px;padding:22px 20px;margin-top:18px;box-shadow:0 6px 0 var(--line);}
  .card h2{font-family:'Jua',sans-serif;font-size:17px;margin:0 0 14px;color:var(--ink);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);margin-bottom:6px;}
  select{
    width:100%;padding:12px 14px;font-size:15px;font-family:'Noto Sans KR',sans-serif;
    border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%238A6E58' stroke-width='2' fill='none'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;
  }
  select:focus{outline:none;border-color:var(--coral);}

  .go-btn{
    width:100%;padding:14px;margin-top:6px;background:var(--coral);color:#fff;border:none;
    border-radius:14px;font-family:'Jua',sans-serif;font-size:17px;cursor:pointer;
    box-shadow:0 5px 0 var(--coral-dark);transition:transform .05s;
  }
  .go-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--coral-dark);}

  .result{display:none;margin-top:20px;}
  .result.show{display:block;}
  .headline-result{text-align:center;font-family:'Jua',sans-serif;font-size:22px;color:var(--ink);margin-bottom:6px;line-height:1.5;}
  .headline-result .num{color:var(--coral-dark);font-size:30px;}
  .sub-result{text-align:center;font-size:13px;color:var(--ink-soft);margin-bottom:20px;}

  .track-row{margin-bottom:16px;}
  .track-label{display:flex;justify-content:space-between;font-size:13px;font-weight:500;margin-bottom:6px;}
  .track-label .me{color:var(--coral-dark);}
  .track-label .avg{color:var(--mint-dark);}
  .track{position:relative;height:34px;background:var(--bg);border-radius:17px;border:2px solid var(--line);overflow:visible;}
  .track-fill{
    position:absolute;left:0;top:0;bottom:0;border-radius:17px;
    display:flex;align-items:center;justify-content:flex-end;padding-right:10px;
    font-size:12px;font-weight:700;color:#fff;transition:width .8s cubic-bezier(.34,1.56,.64,1);
  }
  .track-fill.me{background:var(--coral);}
  .track-fill.avg{background:var(--mint);}
  .track-icon{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:20px;}

  .badge{
    display:inline-block;background:var(--yellow);color:#7A5A00;font-size:12px;font-weight:700;
    padding:5px 12px;border-radius:999px;margin:0 auto 14px;display:table;
  }

  .share-btn{
    width:100%;padding:13px;margin-top:6px;background:#fff;color:var(--ink);
    border:2px solid var(--line);border-radius:14px;font-family:'Noto Sans KR',sans-serif;
    font-weight:700;font-size:14px;cursor:pointer;
  }

  .source{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:12px;line-height:1.6;}

  .related{margin-top:28px;}
  .related h3{font-family:'Jua',sans-serif;font-size:15px;margin:0 0 10px;color:var(--ink-soft);}
  .related-grid{display:flex;flex-direction:column;gap:8px;}
  .related-item{
    display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;
    padding:12px 14px;text-decoration:none;color:var(--ink);border:2px solid var(--line);
  }
  .related-item .emoji{font-size:20px;}
  .related-item .txt{font-size:13px;font-weight:500;}


  .why-box{
    background:var(--bg);border-radius:14px;padding:16px;margin:18px 0;
    border:2px dashed var(--line);
  }
  .why-box .why-title{
    font-family:'Jua',sans-serif;font-size:14px;margin:0 0 8px;
    display:flex;align-items:center;gap:6px;
  }
  .why-box p.why-text{font-size:13px;line-height:1.7;margin:0;}
  .footer-link{display:block;text-align:center;margin-top:26px;font-size:12px;color:var(--ink-soft);text-decoration:none;}
</style>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="wrap">

  <a class="brandbar" href="index.html">
    <span class="b1">내위치</span>
    <span class="b2">by CBM Lab</span>
  </a>

  <div class="hero">
    <h1>내 한 달 커피값,<br>또래 평균보다 많을까?</h1>
    <p>한 달에 쓰는 커피값만 골라봐요</p>
  </div>

  <svg class="mascot" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="김이 나는 귀여운 커피컵 캐릭터 일러스트">
    <ellipse cx="100" cy="128" rx="70" ry="7" fill="#EBDCC9"/>
    <path d="M60 100 q40 12 80 0 l-8 20 q-32 10 -64 0 z" fill="#8C5A2C"/>
    <path d="M62 60 h76 l-6 42 q-32 10 -64 0 z" fill="#C08552"/>
    <ellipse cx="100" cy="60" rx="38" ry="9" fill="#F3D9B8"/>
    <path d="M138 68 q22 -2 20 16 q-2 16 -22 12" fill="none" stroke="#8C5A2C" stroke-width="6" stroke-linecap="round"/>
    <path d="M78 46 q-4 -10 4 -18" fill="none" stroke="#D9C6AE" stroke-width="4" stroke-linecap="round"/>
    <path d="M100 42 q-4 -10 4 -18" fill="none" stroke="#D9C6AE" stroke-width="4" stroke-linecap="round"/>
    <path d="M122 46 q-4 -10 4 -18" fill="none" stroke="#D9C6AE" stroke-width="4" stroke-linecap="round"/>
    <circle cx="88" cy="80" r="3.5" fill="#3E2A1E"/>
    <circle cx="112" cy="80" r="3.5" fill="#3E2A1E"/>
    <path d="M88 90 q12 8 24 0" fill="none" stroke="#3E2A1E" stroke-width="3" stroke-linecap="round"/>
  </svg>

  <div class="card">
    <h2>나는 이래요</h2>
    <div class="field">
      <label for="ageband">나이대</label>
      <select id="ageband">
        <option value="20s">20대</option>
        <option value="30s" selected>30대</option>
        <option value="40s">40대</option>
        <option value="50s">50대</option>
      </select>
    </div>
    <div class="field">
      <label for="freq">하루 평균 커피 마시는 횟수</label>
      <select id="freq">
        <option value="0">안 마심</option>
        <option value="1">1잔</option>
        <option value="2" selected>2잔</option>
        <option value="3">3잔</option>
        <option value="4">4잔 이상</option>
      </select>
    </div>
    <div class="field">
      <label for="price">주로 마시는 커피 가격대</label>
      <select id="price">
        <option value="2000">저가 브랜드 (2,000원대)</option>
        <option value="3500" selected>일반 카페 (3,000~4,000원대)</option>
        <option value="6000">스페셜티/디저트 세트 (5,000원 이상)</option>
      </select>
    </div>
    <button class="go-btn" onclick="showResult()">비교해보기 →</button>

    <div class="result" id="resultBox">
      <div class="badge" id="badgeText"></div>
      <div class="headline-result" id="headlineText"></div>
      <div class="sub-result" id="subText"></div>

      <div class="track-row">
        <div class="track-label"><span class="me">나</span><span id="meMin"></span></div>
        <div class="track" id="meTrack">
          <div class="track-fill me" id="meFill"><span class="track-icon">☕</span></div>
        </div>
      </div>
      <div class="track-row">
        <div class="track-label"><span class="avg">또래 평균</span><span id="avgMin"></span></div>
        <div class="track" id="avgTrack">
          <div class="track-fill avg" id="avgFill"><span class="track-icon">🫘</span></div>
        </div>
      </div>

            <div class="why-box">
        <p class="why-title">💡 왜 이런 결과가 나왔을까요?</p>
        <p class="why-text" id="whyText"></p>
      </div>

      <button class="share-btn" onclick="shareResult()">📤 카톡으로 결과 자랑하기</button>
      <p class="source">출처: 한국소비자단체협의회 「커피 소비자 인식 및 지출비용 조사」, 사람인 「직장인 커피 소비」 조사, 성인 연간 커피 소비량 조사(2019년 기준 나이대별 주간 소비량)</p>
    </div>
  </div>

  <div class="related">
    <h3>다른 사람들이 본 랭킹</h3>
    <div class="related-grid">
      <a class="related-item" href="commute-time-calculator.html">
        <span class="emoji">🚌</span><span class="txt">내 출퇴근 시간 vs 전국 평균</span>
      </a>
      <a class="related-item" href="job-change-calculator.html">
        <span class="emoji">💼</span><span class="txt">내 이직 횟수 vs 내 나이대</span>
      </a>
    </div>
  </div>

  <a class="footer-link" href="../index.html">CBM Lab의 다른 무역 도구 보기 →</a>
</div>

<script>
// 한국소비자단체협의회 / 사람인 조사 기반 근사치: 성인 1인당 월평균 커피 지출 약 104,000~120,000원
const avgMonthly = 112000;
// 디지틀조선일보 보도(한국인 커피 소비 조사) 기반: 나이대별 주간 커피 섭취 잔수
// 20대 6.72잔, 30대 9.66잔, 40대 10.23잔, 50대 9.82잔 (평균 약 9.11잔) - 이 비율로 나이대별 지출 평균을 보정
const weeklyCupsByAge = { "20s": 6.72, "30s": 9.66, "40s": 10.23, "50s": 9.82 };
const avgWeeklyCups = (6.72 + 9.66 + 10.23 + 9.82) / 4;
const ageLabelCoffee = { "20s": "20대", "30s": "30대", "40s": "40대", "50s": "50대" };

function showResult(){
  const ageband = document.getElementById('ageband').value;
  const freq = Number(document.getElementById('freq').value);
  const price = Number(document.getElementById('price').value);
  const myMonthly = Math.round(freq * price * 30 / 1000) * 1000;

  const ageRatio = weeklyCupsByAge[ageband] / avgWeeklyCups;
  const avgForAge = Math.round(avgMonthly * ageRatio / 1000) * 1000;
  const diff = myMonthly - avgForAge;
  const badge = document.getElementById('badgeText');
  const headline = document.getElementById('headlineText');
  const sub = document.getElementById('subText');

  let badgeMsg, headMsg, subMsg;
  if(myMonthly === 0){
    badgeMsg = "카페인 프리"; headMsg = `한 달 커피값 <span class="num">0원</span>`;
    subMsg = "이 정도면 절약왕이라고 불러도 될까요.";
  } else if(diff <= -40000){
    badgeMsg = "알뜰 절약러"; headMsg = `평균보다 <span class="num">${Math.abs(diff).toLocaleString()}원</span> 덜 써요`;
    subMsg = "커피값 아낀 돈으로 다른 거 하실 듯.";
  } else if(diff < 0){
    badgeMsg = "적당히 즐기는 중"; headMsg = `평균보다 <span class="num">${Math.abs(diff).toLocaleString()}원</span> 적어요`;
    subMsg = "무난한 커피 생활이네요.";
  } else if(diff <= 40000){
    badgeMsg = "딱 평범한 카페인 중독"; headMsg = `평균보다 <span class="num">${diff.toLocaleString()}원</span> 더 써요`;
    subMsg = "커피 없이는 하루가 안 굴러가는 타입.";
  } else {
    badgeMsg = "이 정도면 카페 지분 있어야"; headMsg = `평균보다 <span class="num">${diff.toLocaleString()}원</span>이나 더 써요`;
    subMsg = "1년이면 웬만한 여행 경비인데요.";
  }

  badge.textContent = badgeMsg;
  headline.innerHTML = headMsg;
  sub.textContent = subMsg;

  document.getElementById('meMin').textContent = myMonthly.toLocaleString()+'원';
  document.getElementById('avgMin').textContent = avgForAge.toLocaleString()+'원 ('+ageLabelCoffee[ageband]+' 평균)';

  const maxScale = Math.max(myMonthly, avgForAge, 50000) * 1.15;
  document.getElementById('meFill').style.width = (myMonthly/maxScale*100)+'%';
  document.getElementById('avgFill').style.width = (avgForAge/maxScale*100)+'%';

  document.getElementById('whyText').textContent = `한국소비자단체협의회 조사에서 성인 1인당 월평균 커피 지출이 10만원을 넘긴 이유는, 커피가 이제 기호식품을 넘어 '작업 공간 이용료'나 '만남의 장소 비용' 성격을 함께 갖게 됐기 때문이에요. 여기에 나이대별 소비 패턴을 보면 40대가 주간 10.23잔으로 가장 많이 마시는데, 이는 업무 중 카페인 의존도가 높아지는 시기이기 때문으로 풀이돼요. 반면 20대는 6.72잔으로 상대적으로 적은데, 아직 사회초년생이라 커피값에 좀 더 신중한 경향이 반영된 것으로 보여요.`;

  document.getElementById('resultBox').classList.add('show');
}

function shareResult(){
  const text = document.getElementById('headlineText').textContent;
  if(navigator.share){
    navigator.share({title:'내 커피값 비교 - 내위치', text: '내 한 달 커피값: ' + text, url: location.href});
  } else {
    navigator.clipboard.writeText(location.href);
    alert('링크가 복사됐어요! 카톡에 붙여넣기 해보세요.');
  }
}
</script>
</body>
</html>
