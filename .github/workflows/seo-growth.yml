name: SEO growth loop
on:
  schedule: [{ cron: '17 3 * * 1' }]   # weekly, Monday
  workflow_dispatch:
permissions: { contents: write, pull-requests: write }
jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/seo/keywords.mjs
        continue-on-error: true
      - run: node scripts/seo/inspect.mjs
        continue-on-error: true
        env: { GSC_SA_JSON: "${{ secrets.GSC_SA_JSON }}", GSC_SITE: "${{ secrets.GSC_SITE }}" }
      - run: node scripts/seo/gsc.mjs
        continue-on-error: true
        env: { GSC_SA_JSON: '${{ secrets.GSC_SA_JSON }}', GSC_SITE: '${{ secrets.GSC_SITE }}' }
      - run: node scripts/seo/grow.mjs
        env: { GH_TOKEN: '${{ github.token }}' }
      - name: Commit to main (one deploy per weekly run)
        run: |
          git config user.name cbm-lab-bot; git config user.email bot@users.noreply.github.com
          git add -A
          if git diff --staged --quiet; then echo clean; exit 0; fi
          git commit -m "chore(seo): weekly growth loop $(date +%F)"
          git pull --rebase origin main && git push origin HEAD:main
